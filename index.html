 else h+=({demons,d:()=>demon(view.k),board,p:()=>profile(view.id),bounty,quest,shop,chat:chatP,set:settings}[view.t]||demons)();
 app.className=fr?"anim":"";app.innerHTML=h;
 if(view.t==="set")fillSet();
 if(fr&&!matchMedia("(prefers-reduced-motion: reduce)").matches)app.querySelectorAll(".tw").forEach(typeIn);else app.querySelectorAll(".tw").forEach(e=>e.classList.remove("tw"));
 if(view.t==="chat"&&$(".msgs"))$(".msgs").scrollTop=1e9;
 checkAch();
}
function checkAch(){const p=mine();if(!p)return;const c={...p,L:p.levels||[],e:E(p),rk:pos(me)},have=AC.filter(a=>a[4](c)).map(a=>a[0]);
 if(!S.ach){S.ach=have;return sv()}const nw=AC.filter(a=>have.includes(a[0])&&!S.ach.includes(a[0]));
 if(nw.length){S.ach=have;sv();snd("ach");toast("Achievement: "+nw.map(a=>a[1]+" "+a[2]).join(", "))}}

function demons(){const D=agg();
 let h=`<div class="hero"><h1 class="tw">Geometry Dash Demon List</h1><p>Every demon our group has beaten, hardest first.</p><div class="stat"><div><b>${D.length}</b><span>demons</span></div><div><b>${players.filter(p=>p.name).length}</b><span>players</span></div></div></div>`;
 if(!D.length)h+=empty("No demons yet.","Open Profile to create yours and add your first level.");
 D.forEach((d,i)=>{h+=`<button class="card row-l btn-row" data-a="d" data-k="${esc(d.k)}" style="font:inherit;color:inherit"><div class="rk">${i+1}</div>${th(d)}<div><div class="nm">${esc(d.n)} ${chip(d.tier)}${d.off?" ⭐":""}</div><div class="mut">${d.by?"by "+esc(d.by)+" · ":""}${d.v.length} ${d.v.length===1?"victor":"victors"}</div></div><div class="mut"><b>${P(d.tier)}</b> pts</div></button>`});
 if(adm)h+=`<h2>Add to the official list</h2><div class="card panel"><div class="row"><label>Level<input id="ln" maxlength="60"></label><label>Creator<input id="lc" maxlength="40"></label></div><label>Difficulty<select id="lt">${tierOpts()}</select></label><label>Thumbnail (optional)<input id="lf" type="file" accept="image/*"></label><button class="btn" data-a="ladd">Add to list</button></div>`;
 return h}
function demon(k){const d=agg().find(x=>x.k===k);
 if(!d)return `<button class="link" data-a="demons">← Demons</button><p class="mut">That demon isn’t on the list.</p>`;
 let h=`<button class="link" data-a="demons">← Demons</button><div style="margin-top:12px">${th(d,1)}</div><h1 style="margin-top:14px">${esc(d.n)} ${chip(d.tier)}</h1><p class="mut">${d.by?"By "+esc(d.by)+" · ":""}Worth ${P(d.tier)} points</p>${adm&&d.off?`<button class="btn alt" data-a="ldel" data-id="${esc(d.off)}">Remove from official list</button>`:""}<h2>Victors</h2>`;
 if(!d.v.length)return h+empty("No victors yet.","Be the first to add it to your profile.");
 h+=`<div class="card tbl"><table><tr><th>Player</th><th>Attempts</th><th>Video</th></tr>`;
 d.v.forEach(v=>{const u=url(v.vid);h+=`<tr><td><button class="link" data-a="p" data-id="${esc(v.id)}">${nm(v.p)}</button></td><td>${v.att?esc(v.att):"–"}</td><td>${u?`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">Watch</a>`:"–"}</td></tr>`});
 return h+"</table></div>"}
function board(){const s=srt();
 let h=`<h1>Players</h1><p class="mut">Points per demon: ${T.map((t,i)=>t[0]+" "+P(i)).join(", ")}.</p><div class="ladder">${R.map(r=>`<span class="rank" style="background:${r[2]}">${r[0]} ${r[1]}+</span>`).join("")}</div>`;
 if(!s.length)return h+empty("No players yet.","Open Profile to create yours.");
 h+=`<div class="card tbl"><table><tr><th>#</th><th>Player</th><th>Rank</th><th>Hardest</th><th>Demons</th><th>Points</th></tr>`;
 s.forEach((p,i)=>{const L=p.levels||[],t=L[0];h+=`<tr><td>${i+1}</td><td><button class="link" data-a="p" data-id="${esc(p.id)}">${nm(p,ico(i))}</button></td><td>${badge(E(p))}</td><td>${t?esc(t.n)+" "+chip(t.tier):"–"}</td><td>${L.length}</td><td><b>${E(p)}</b></td></tr>`});
 return h+"</table></div>"}
function profile(id){
 const p=players.find(x=>x.id===id&&x.name),own=id===me;
 if(!p){if(!own)return `<p class="mut">That player isn’t on the list.</p>`;if(!me)return `<p class="mut">Still connecting. Try again in a moment.</p>`;
  return `<h1>Create your profile</h1><div class="card panel"><label>Username (can’t be changed later)<input id="pn" maxlength="32"></label><label>Country<select id="pf">${fopts("")}</select></label><span class="mut">Your profile is saved to this browser. Clearing site data starts a new one.</span><button class="btn" data-a="mk">Create profile</button></div>`}
 const L=p.levels||[],x=E(p),ri=rk(x),nx=R[ri+1],e=p.equip||{},ps=pos(id),bn=okc("ban",e.ban)?"b-"+e.ban:"",fr=okc("frm",e.frm)?"f-"+e.frm:"",c={...p,L,e:x,rk:ps};
 let h=`<button class="link" data-a="board">← Players</button><div class="card prof" style="margin-top:12px"><div class="bn ${bn}" ${bn?"":`style="background:${R[ri][2]}"`}></div>
 <div class="ph-head"><div class="av ${fr}" ${fr?"":`style="background:${R[ri][2]}"`}><div>${esc((p.display||p.name)[0].toUpperCase())}</div></div>
 <div style="flex:1;min-width:0;padding-top:8px"><h1>${nm(p,ico(ps-1))}</h1><div class="mut">@${esc(p.name)} ${badge(x)}</div>${p.bio?`<p style="margin:8px 0 0">${esc(p.bio)}</p>`:""}
 <div class="stat"><div><b>#${ps}</b><span>rank</span></div><div><b>${x}</b><span>earned</span></div><div><b>${L.length}</b><span>demons</span></div>${own?`<div><b>${B(p)}</b><span>to spend</span></div>`:""}</div>
 ${nx?`<div class="mut" style="margin-top:10px">${nx[1]-x} points to ${nx[0]}</div><div class="bar"><i style="width:${Math.round((x-R[ri][1])/(nx[1]-R[ri][1])*100)}%"></i></div>`:`<div class="mut" style="margin-top:10px">Top rank reached.</div>`}
 </div></div></div>
 ${adm&&!own?`<div class="card panel"><label>Role<select data-role="${esc(id)}"><option value="">Member</option>${["mod","pro","vip"].map(r=>`<option value="${r}"${roles[id]===r?" selected":""}>${ROLES[r][0]}</option>`).join("")}</select></label></div>`:""}
 <h2>Achievements</h2><div>${AC.map(a=>`<span class="ach ${a[4](c)?"":"lock"}">${a[1]}<small>${a[2]}</small></span>`).join("")}</div><h2>Hardest first</h2>`;
 if(!L.length)h+=`<p class="mut">${own?"Nothing here yet. Add your first level below.":"No levels listed yet."}</p>`;
 L.forEach((l,i)=>{const v=url(l.vid);h+=`<div class="card row-l${i===0?" top":""}"><div class="rk">${i+1}</div>${th(l)}<div><div class="nm"><button class="link" data-a="d" data-k="${esc((l.n||"").trim().toLowerCase())}">${esc(l.n)}</button> ${chip(l.tier)}</div><div class="mut">${l.by?"by "+esc(l.by):""}${l.att?(l.by?" · ":"")+esc(l.att)+" attempts":""}${v?` · <a class="link" href="${esc(v)}" target="_blank" rel="noopener">Video</a>`:""}</div></div>
  ${own?`<div class="ctl"><button class="ic" data-a="up" data-i="${i}" aria-label="Move up">↑</button><button class="ic" data-a="dn" data-i="${i}" aria-label="Move down">↓</button><button class="ic" data-a="rm" data-i="${i}" aria-label="Remove">✕</button></div>`:"<span></span>"}</div>`});
 if(own){const left=14*864e5-(Date.now()-(p.dispAt||0)),can=left<=0;
  h+=`<h2>Add a level</h2><div class="card panel"><div class="row"><label>Level name<input id="ln" maxlength="60"></label><label>Creator<input id="lc" maxlength="40"></label></div><div class="row"><label>Difficulty<select id="lt">${tierOpts()}</select></label><label>Attempts (optional)<input id="la" type="number" min="1" max="9999999"></label></div><label>Video link (optional)<input id="lv" type="url" placeholder="https://"></label><label>Thumbnail (optional)<input id="lf" type="file" accept="image/*"></label><button class="btn" data-a="add">Add level</button></div>
  <h2>Profile</h2><div class="card panel"><label>Display name${can?"":` (you can change it again in ${Math.ceil(left/864e5)} days)`}<input id="pd" maxlength="24" value="${esc(p.display)}" placeholder="${esc(p.name)}" ${can?"":"disabled"}></label><span class="mut">Your username @${esc(p.name)} stays the same. You can change your display name once every 14 days.</span><label>Country<select id="pf">${fopts(p.flag)}</select></label><label>Bio<textarea id="pb" rows="2" maxlength="300">${esc(p.bio)}</textarea></label><button class="btn alt" data-a="prof">Save profile</button></div>`}
 return h}
function bounty(){const p=mine(),cl=p?p.claimed||[]:[];
 let h=`<h1>Bounties</h1><p class="mut">Beat the target demon, then claim the points.</p>`;
 if(!bounties.length)h+=empty("No bounties right now.",adm?"Add one below.":"Check back soon.");
 bounties.forEach(b=>{const done=p&&(p.levels||[]).some(l=>(l.n||"").trim().toLowerCase()===(b.lv||"").trim().toLowerCase()),got=cl.some(c=>c.i===b.id);
  h+=`<div class="card row-l" style="grid-template-columns:1fr auto"><div><div class="nm">Beat ${esc(b.lv)}</div><div class="mut">${esc(b.note)} · +${+b.r||0} pts</div></div><div class="ctl">${got?`<span class="chip" style="background:#2f9e44">Claimed</span>`:done?`<button class="btn" data-a="claim" data-id="${esc(b.id)}" data-r="${+b.r||0}">Claim</button>`:`<span class="mut">Not yet</span>`}${adm?`<button class="ic" data-a="bdel" data-id="${esc(b.id)}" aria-label="Delete">✕</button>`:""}</div></div>`});
 if(adm)h+=`<h2>New bounty</h2><div class="card panel"><div class="row"><label>Level name<input id="bl" maxlength="60"></label><label>Reward points<input id="br" type="number" min="1" max="1000"></label></div><label>Note (optional)<input id="bn" maxlength="100"></label><button class="btn" data-a="badd">Add bounty</button></div>`;
 return h}
function quest(){const p=mine(),cl=p?p.claimed||[]:[];
 let h=`<h1>Quests</h1><p class="mut">Finish the task, then mark it complete to earn points.</p>`;
 if(!quests.length)h+=empty("No quests right now.",adm?"Add one below.":"Check back soon.");
 quests.forEach(q=>{const got=cl.some(c=>c.i===q.id);
  h+=`<div class="card row-l" style="grid-template-columns:1fr auto"><div><div class="nm">${esc(q.t)}</div><div class="mut">${esc(q.d)} · +${+q.r||0} pts</div></div><div class="ctl">${got?`<span class="chip" style="background:#2f9e44">Done</span>`:p?`<button class="btn" data-a="claim" data-id="${esc(q.id)}" data-r="${+q.r||0}">Complete</button>`:""}${adm?`<button class="ic" data-a="qdel" data-id="${esc(q.id)}" aria-label="Delete">✕</button>`:""}</div></div>`});
 if(adm)h+=`<h2>New quest</h2><div class="card panel"><label>Title<input id="qt" maxlength="60"></label><label>Description<input id="qd" maxlength="140"></label><label>Reward points<input id="qr" type="number" min="1" max="1000"></label><button class="btn" data-a="qadd">Add quest</button></div>`;
 return h}
function shop(){const p=mine();if(!p)return `<h1>Shop</h1>${empty("Create a profile first.","Open Profile to get started.")}`;
 const ow=p.owned||[],e=p.equip||{};
 let h=`<h1>Shop</h1><p class="mut">You have <b>${B(p)}</b> points to spend. Cooler items cost more.</p>`;
 Object.keys(KN).forEach(k=>{h+=`<h2>${KN[k]}</h2><div class="shop">`;
  SH.filter(s=>s[0]===k).forEach(s=>{const key=k+":"+s[1],own=ow.includes(key),on=e[k]===s[1],pv=k==="col"?`<b class="${"cos-"+s[1]}">Preview</b>`:k==="fon"?`<b style="font-family:'${s[1]}',Rubik,sans-serif">Preview</b>`:k==="ban"?`<div class="bn mini b-${s[1]}"></div>`:`<div class="av sm f-${s[1]}"><div></div></div>`;
   h+=`<div class="card">${pv}<div><div class="nm">${s[2]}</div>${own?`<button class="btn alt" data-a="${on?"uneq":"eq"}" data-k="${key}" style="margin-top:6px">${on?"Unequip":"Equip"}</button>`:`<button class="btn" data-a="buy" data-k="${key}" style="margin-top:6px" ${B(p)<s[3]?"disabled":""}>${s[3]} pts</button>`}</div></div>`});
  h+="</div>"});
 return h}
const msgs=()=>chat.map(m=>{const p=players.find(x=>x.id===m.uid),mn=m.uid===me,can=adm||roles[me]==="mod"||mn;
 return `<div class="msg${mn?" me":""}"><small>${p?nm(p):"Guest"} · ${new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}${can?` <button class="link" data-a="cdel" data-id="${esc(m.id)}" aria-label="Delete">✕</button>`:""}</small><div>${esc(m.text)}</div></div>`}).join("")||`<span class="mut">No messages yet. Say hi.</span>`;
function chatP(){return `<h1>Chat</h1><div class="card msgs" style="margin-top:12px">${msgs()}</div>${mine()?`<div class="send"><input id="cm" maxlength="200" placeholder="Message" autocomplete="off"><button class="btn" data-a="send">Send</button></div>`:`<p class="mut">Create a profile to chat.</p>`}`}
function settings(){return `<h1>Settings</h1><div class="card panel"><label>Theme<select id="sm"><option value="dark">Dark</option><option value="light">Light</option><option value="custom">Custom colors</option></select></label><div class="row"><label>Custom accent<input id="sa" type="color"></label><label>Custom background<input id="sb" type="color"></label></div><label style="display:flex;gap:8px;align-items:center"><input id="sf" type="checkbox" style="width:auto">Glow and motion effects</label><label style="display:flex;gap:8px;align-items:center"><input id="ss" type="checkbox" style="width:auto">Sound effects</label></div>
 ${adm?`<h2>Owner: points per difficulty</h2><div class="card panel"><div class="row">${T.map((t,i)=>`<label>${t[0]}<input id="pt${i}" type="number" min="0" max="1000" value="${P(i)}"></label>`).join("")}</div><button class="btn" data-a="pts">Save points</button></div>`:""}
 <h2>Your ID</h2><div class="card panel"><code style="word-break:break-all">${esc(me)}</code><span class="mut">Owner setup: in Firebase, create a document in the admins collection using this ID as the document ID.</span></div>`}
function fillSet(){$("#sm").value=S.m||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");$("#sa").value=S.a||"#00d1b2";$("#sb").value=S.b||"#101820";$("#sf").checked=S.f!==false;$("#ss").checked=S.s!==false}

document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.role)return W(()=>t.value?db.doc("roles/"+t.dataset.role).set({role:t.value}):db.doc("roles/"+t.dataset.role).delete());
 const m={sm:["m",t.value],sf:["f",t.checked],ss:["s",t.checked]}[t.id];if(m){S[m[0]]=m[1];sv();applyTheme();snd("ok")}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="sa"||t.id==="sb"){S[t.id==="sa"?"a":"b"]=t.value;S.m="custom";sv();applyTheme();$("#sm").value="custom"}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cm")send()});
function send(){const i=$("#cm"),t=i&&i.value.trim();if(!t||!mine()||Date.now()-(send.l||0)<800)return;send.l=Date.now();i.value="";W(()=>db.collection("chat").add({uid:me,text:t.slice(0,200),t:Date.now()}))}
const num=v=>Math.max(0,Math.min(1000,Math.round(+v||0)));

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;snd("click");
 const a=b.dataset.a,d=b.dataset,i=+d.i;
 const G={demons:{t:"demons"},board:{t:"board"},bounty:{t:"bounty"},quest:{t:"quest"},shop:{t:"shop"},chat:{t:"chat"},set:{t:"set"},d:{t:"d",k:d.k},p:{t:"p",id:d.id},me:{t:"p",id:me}};
 if(G[a])return go(G[a]);
 if(!db||!me)return;
 const p=mine(),L=p?[...(p.levels||[])]:[],e2=p?p.equip||{}:{};
 if(a==="mk"){const n=$("#pn").value.trim();if(n.length<2)return;
  if(players.some(x=>(x.name||"").toLowerCase()===n.toLowerCase())){err="That username is taken.";snd("err");return render()}
  await upd({name:n,flag:$("#pf").value});snd("ok");return go({t:"p",id:me})}
 if(a==="send")return send();
 if(a==="cdel")return W(()=>db.collection("chat").doc(d.id).delete());
 if(adm){
  if(a==="badd"){const lv=$("#bl").value.trim();if(!lv)return;return W(()=>db.collection("bounties").add({lv,r:num($("#br").value),note:$("#bn").value.trim()}))}
  if(a==="bdel")return W(()=>db.collection("bounties").doc(d.id).delete());
  if(a==="qadd"){const t=$("#qt").value.trim();if(!t)return;return W(()=>db.collection("quests").add({t,d:$("#qd").value.trim(),r:num($("#qr").value)}))}
  if(a==="qdel")return W(()=>db.collection("quests").doc(d.id).delete());
  if(a==="ldel")return W(async()=>{await db.collection("list").doc(d.id).delete();go({t:"demons"})});
  if(a==="pts")return W(async()=>{await db.doc("config/points").set({pts:T.map((t,j)=>num($("#pt"+j).value))});snd("ok");toast("Points saved")});
  if(a==="ladd"){const n=$("#ln").value.trim();if(!n)return;const f=$("#lf").files[0],o={k:n.toLowerCase(),n,by:$("#lc").value.trim(),tier:+$("#lt").value};
   b.disabled=true;if(f)try{o.thumb=await thumbBlob(f)}catch(x){}
   return W(async()=>{await db.collection("list").add(o);snd("ok")})}}
 if(!p)return;
 if(a==="prof"){const dp=$("#pd"),pt={bio:$("#pb").value.trim().slice(0,300),flag:$("#pf").value};
  if(dp&&!dp.disabled&&dp.value.trim()!==(p.display||"")){pt.display=dp.value.trim().slice(0,24);pt.dispAt=Date.now()}
  await upd(pt);snd("ok");return render()}
 if(a==="claim"){const c=p.claimed||[];if(c.some(x=>x.i===d.id))return;await upd({claimed:[...c,{i:d.id,r:+d.r||0}]});snd("buy");return toast("+"+(+d.r||0)+" points")}
 if(a==="buy"){const it=SH.find(s=>s[0]+":"+s[1]===d.k);if(!it||(p.owned||[]).includes(d.k)||B(p)<it[3])return snd("err");
  await upd({owned:[...(p.owned||[]),d.k],spent:(p.spent||0)+it[3],equip:{...e2,[it[0]]:it[1]}});snd("buy");return toast("Bought "+it[2])}
 if(a==="eq"){const[k,v]=d.k.split(":");if(!(p.owned||[]).includes(d.k))return;return upd({equip:{...e2,[k]:v}})}
 if(a==="uneq"){const q={...e2};delete q[d.k.split(":")[0]];return upd({equip:q})}
 if(a==="add"){const n=$("#ln").value.trim();if(!n||L.length>=60)return;
  const t=+$("#lt").value,at=parseInt($("#la").value,10),f=$("#lf").files[0],lv={n,by:$("#lc").value.trim(),tier:t,vid:url($("#lv").value.trim())};
  if(at>0)lv.att=at;
  if(f){b.disabled=true;b.textContent="Uploading…";try{lv.thumb=await thumbBlob(f)}catch(x){}}
  let ps=L.findIndex(x=>x.tier<t);if(ps<0)ps=L.length;L.splice(ps,0,lv);await upd({levels:L});snd("ok");return render()}
 if(a==="rm")L.splice(i,1);else if(a==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];else if(a==="dn"&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];else return;
 await upd({levels:L})});
</script></body></html>
